<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Monedero Digital DashCamPay">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Monedero Digital">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  
  <!-- Meta tag para color de tema dinámico -->
  <meta name="theme-color" content="#2C2C2C" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Monedero Digital</title>
  <link rel="manifest" href="manifest.json">
  <script
    type="text/javascript"
    src="https://docs.netpay.mx/cdn/v1.3/netpay.min.js"></script>
  
  <!-- Google Maps JavaScript API: la clave se inyecta en tiempo de ejecución desde la variable de compilación (valor en android/local.properties). Build: flutter build web --dart-define=GOOGLE_MAPS_API_KEY=$(grep google.maps.api.key android/local.properties | cut -d= -f2) -->
  
  <!-- Estilos para evitar franja blanca en modo oscuro -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #2C2C2C;
      overflow: hidden;
    }
    
    @media (prefers-color-scheme: light) {
      html, body {
        background-color: #FFFFFF;
      }
    }
    
    @media (prefers-color-scheme: dark) {
      html, body {
        background-color: #2C2C2C;
      }
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
