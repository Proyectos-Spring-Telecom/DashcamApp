<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Monedero Digital">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  
  <!-- Meta tag para color de tema dinámico -->
  <meta name="theme-color" content="#2C2C2C" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Monedero Digital</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Google Maps JavaScript API - Cargar con loading=async para mejor rendimiento -->
  <script 
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC3vvrNAZOxtjzm0LmdDzSW9gXT1ZZbEYQ&libraries=places&loading=async" 
    async 
    defer
    onerror="console.error('Error al cargar Google Maps JavaScript API')">
  </script>
  
  <!-- Estilos para evitar franja blanca en modo oscuro -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #2C2C2C;
      overflow: hidden;
    }
    
    @media (prefers-color-scheme: light) {
      html, body {
        background-color: #FFFFFF;
      }
    }
    
    @media (prefers-color-scheme: dark) {
      html, body {
        background-color: #2C2C2C;
      }
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
